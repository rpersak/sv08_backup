# ---------------------------------------------------------------------
#  SUŠENJE FILAMENTA NA MIZI
#
#  Uporaba:   SUSENJE TEMPERATURA=70 CAS=8 VENTILATOR=0.1
#             KONEC_SUSENJA          -> predčasna prekinitev
#
#  SET_IDLE_TIMEOUT sprejme SAMO parameter TIMEOUT=, zato čas meri
#  [delayed_gcode]. idle_timeout (_IDLE_TIMEOUT) ostane varnostna mreža.
# ---------------------------------------------------------------------
[gcode_macro SUSENJE]
description: Susenje filamenta na mizi. TEMPERATURA=C CAS=ure VENTILATOR=0-1
variable_ventilator: "exhaust_fan"
# Trda meja za sušenje, neodvisno od heater_bed max_temp (ta je pri tebi 115)
variable_max_temp: 100
gcode:
    {% set temp = params.TEMPERATURA|default(70)|int %}
    {% set cas = params.CAS|default(8)|float %}
    {% set hitrost = params.VENTILATOR|default(0.1)|float %}
    {% set sekunde = (cas * 3600)|int %}

    {% if printer.print_stats.state == "printing" %}
        {action_raise_error("SUSENJE: tiskalnik trenutno tiska.")}
    {% endif %}
    {% if temp > max_temp %}
        {action_raise_error("SUSENJE: TEMPERATURA=" ~ temp ~ " je nad mejo " ~ max_temp ~ " C.")}
    {% endif %}
    {% if cas <= 0 or hitrost < 0 or hitrost > 1 %}
        {action_raise_error("SUSENJE: CAS mora biti > 0, VENTILATOR med 0 in 1.")}
    {% endif %}

    SET_IDLE_TIMEOUT TIMEOUT={sekunde + 600}
    M140 S{temp}
    SET_FAN_SPEED FAN={ventilator} SPEED={hitrost}
    UPDATE_DELAYED_GCODE ID=_SUSENJE_TIMER DURATION={sekunde}
    M118 Susenje: miza {temp}C, {ventilator} {(hitrost * 100)|int}%, trajanje {cas} h.


[gcode_macro KONEC_SUSENJA]
description: Zakljuci susenje - izklop mize in ventilatorja, ponastavi idle_timeout
gcode:
    {% set ventilator = printer["gcode_macro SUSENJE"].ventilator %}
    UPDATE_DELAYED_GCODE ID=_SUSENJE_TIMER DURATION=0
    {% if printer.print_stats.state == "printing" %}
        M118 Susenje: casovnik potekel med tiskom - nic ne spreminjam.
    {% else %}
        M140 S0
        SET_FAN_SPEED FAN={ventilator} SPEED=0
        {% if 'idle_timeout' in printer.configfile.settings %}
            SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout|int}
        {% else %}
            SET_IDLE_TIMEOUT TIMEOUT=600
        {% endif %}
        M118 Susenje koncano: miza in {ventilator} izklopljena.
    {% endif %}


[delayed_gcode _SUSENJE_TIMER]
gcode:
    KONEC_SUSENJA


# ---------------------------------------------------------------------
#  ABS HEAT SOAK  (drzanje mize na 110 C brez izklopa zaradi idle_timeout)
#
#  Uporaba:   ABS_HEAT_SOAK                       -> 110 C, 3 h
#             ABS_HEAT_SOAK TEMPERATURA=110 CAS=4
#             ABS_HEAT_SOAK_END                   -> predcasen konec
#
#  - idle_timeout se podaljsa na CAS + 10 min, zato _IDLE_TIMEOUT
#    (M84 + TURN_OFF_HEATERS) ne izklopi mize.
#  - CAS je trda varovalka (max 8 h): po poteku se miza vedno izklopi.
#  - Izpusni ventilator se za cas soaka ugasne, da se ohisje ogreje.
#  - Trda meja TEMPERATURA je 110 C (heater_bed max_temp je 115).
#    Stock miza je specificirana za 100 C, zato 110 le, ce je miza to
#    sposobna (mod). Ne dvigaj max_temp.
#  - Ne uporabljaj hkrati s SUSENJE (oba spreminjata idle_timeout).
#  - Po soaku zazeni tisk; START_PRINT sam nastavi mizo na tarcno temp.
# ---------------------------------------------------------------------
[gcode_macro ABS_HEAT_SOAK]
description: Drzi mizo na TEMPERATURA (privzeto 110 C) do CAS ur ali do ABS_HEAT_SOAK_END
variable_ventilator: "exhaust_fan"
variable_max_temp: 110
variable_max_cas: 8
gcode:
    {% set temp = params.TEMPERATURA|default(110)|int %}
    {% set cas = params.CAS|default(3)|float %}
    {% set sekunde = (cas * 3600)|int %}

    {% if printer.print_stats.state == "printing" or printer.print_stats.state == "paused" %}
        {action_raise_error("ABS_HEAT_SOAK: tiskalnik trenutno tiska ali je v pavzi.")}
    {% endif %}
    {% if temp < 40 or temp > max_temp %}
        {action_raise_error("ABS_HEAT_SOAK: TEMPERATURA=" ~ temp ~ " mora biti med 40 in " ~ max_temp ~ " C.")}
    {% endif %}
    {% if cas <= 0 or cas > max_cas %}
        {action_raise_error("ABS_HEAT_SOAK: CAS mora biti > 0 in najvec " ~ max_cas ~ " h.")}
    {% endif %}

    SET_IDLE_TIMEOUT TIMEOUT={sekunde + 600}
    M140 S{temp}
    SET_FAN_SPEED FAN={ventilator} SPEED=0
    UPDATE_DELAYED_GCODE ID=_ABS_HEAT_SOAK_TIMER DURATION={sekunde}
    M118 ABS soak: miza {temp}C, {ventilator} izklopljen, konec cez {cas} h (ali ABS_HEAT_SOAK_END).


[gcode_macro ABS_HEAT_SOAK_END]
description: Konec ABS heat soaka - izklop mize, ponastavi idle_timeout
gcode:
    {% set ventilator = printer["gcode_macro ABS_HEAT_SOAK"].ventilator %}
    UPDATE_DELAYED_GCODE ID=_ABS_HEAT_SOAK_TIMER DURATION=0
    {% if 'idle_timeout' in printer.configfile.settings %}
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout|int}
    {% else %}
        SET_IDLE_TIMEOUT TIMEOUT=600
    {% endif %}
    {% if printer.print_stats.state == "printing" or printer.print_stats.state == "paused" %}
        M118 ABS soak: tisk poteka - mize in ventilatorja ne spreminjam, idle_timeout ponastavljen.
    {% else %}
        M140 S0
        SET_FAN_SPEED FAN={ventilator} SPEED=0
        M118 ABS soak koncan: miza izklopljena, idle_timeout ponastavljen.
    {% endif %}


[delayed_gcode _ABS_HEAT_SOAK_TIMER]
gcode:
    ABS_HEAT_SOAK_END


# =====================================================================
#  PREDLAGANE SPREMEMBE V printer.cfg  (NE odkomentiraj tukaj –
#  popravi obstoječe sekcije v printer.cfg, sicer pride do podvajanja)
# =====================================================================

# --- [probe_eddy_current eddy] -----------------------------------------
#  descend_z: 3.0  ->  0.5 … 1.0
#  Pri 3 mm je občutljivost ~9,5 kHz/mm, pri 0,5 mm ~32 kHz/mm
#  (iz tvoje kalibracijske krivulje). Dokumentacija priporoča 0.5.
#  Kalibracije ni treba ponavljati; po spremembi test prvega sloja + babystep.
#
#  descend_z: 0.5

# --- [bed_mesh] -----------------------------------------------------------
#  Uskladi mesh s točko Z hominga (homing_override: G0 X191 Y165 -> G28 Z).
#  Trenutni mesh ima tam +0,246 mm -> ta zamik se prišteje k prvemu sloju.
#  POZOR: po spremembi se prvi sloj premakne za ~0,25 mm -> nov babystep!
#
#  zero_reference_position: 191, 165
#  adaptive_margin: 5

# --- [input_shaper] ------------------------------------------------------
#  damping_ratio_x/y: 0.001 odstrani (privzeto 0.1; docs: "should not be changed").
#  mzv 35/35 je verjetno ročna vrednost; prejšnja meritev X 52.8 / Y 36.2 Hz.
#  Po zategnitvi Y jermena:  SHAPER_CALIBRATE  ->  SAVE_CONFIG

# --- [controller_fan MCU_fan] ---------------------------------------------
#  Sunon 1.92 W na polno je preglasen. Prvi korak:
#  fan_speed: 0.5      # preveri mcu_temp med dolgim tiskom; če piska, vrni

# --- [fan_generic exhaust_fan] ----------------------------------------------
#  max_power: 0.5      # bistveno tišje, za PLA/PETG dovolj

# --- [heater_bed] ---------------------------------------------------------
#  max_temp: 115 -> 105   (stock miza je specificirana za 100 C; 115 le po HW modu)

# --- [stepper_z] (samo če boš uporabljal tap) ---------------------------
#  position_min: -5 -> -1   (vrednost iz Eddy_Probe.md; manjši možni globinski trk)


# =====================================================================
#  EDDY – postopki (konzola)
# =====================================================================
#  Babystep -> trajno:
#     G28
#     SET_GCODE_OFFSET Z=0.28        ; + dvigne šobo, - spusti
#     Z_OFFSET_APPLY_PROBE
#     SAVE_CONFIG
#
#  Tap kalibracija (opcijsko, odpravi termični drift):
#     šoba 3–10 mm nad sredino, čista šoba in miza, roka na M112
#     PROBE_EDDY_CURRENT_TAP_CALIBRATE TAP=guess
#     PROBE_EDDY_CURRENT_TAP_CALIBRATE TAP=refine
#     PROBE_EDDY_CURRENT_TAP_CALIBRATE TAP=verify
#     SAVE_CONFIG
#  Popravek tap offseta:  Z_OFFSET_APPLY_PROBE METHOD=tap


# =====================================================================
#  PRINT_START – ODREZEK (vrstni red). Dejanski makro je v Macro.cfg.
#  Pogoj v OrcaSlicerju: Others > Exclude objects.
#  KAMP (če ga uporabiš): samo Line_Purge.cfg + Smart_Park.cfg,
#  NE Adaptive_Meshing.cfg (zavrže METHOD=rapid_scan).
#
#     G28
#     QUAD_GANTRY_LEVEL
#     G28 Z
#     BED_MESH_CLEAR
#     BED_MESH_CALIBRATE ADAPTIVE=1 METHOD=rapid_scan
#     SMART_PARK                       ; KAMP (opcijsko)
#     M109 S{params.EXTRUDER_TEMP}     ; tvoja logika segrevanja
#     LINE_PURGE                       ; KAMP (opcijsko)
# =====================================================================
